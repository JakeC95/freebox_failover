#cloud-config
ssh_authorized_keys:
  - ssh-rsa XXXXXX
ssh_pwauth: false
disable_root: true

system_info:
  default_user:
    name: freebox
    lock_passwd: true
  groups:
    - freebox

packages:
 - usbutils
 - nftables

write_files:
# enable IPv4 and IPv6 forwarding
- content: |
    net.ipv4.ip_forward=1
    net.ipv6.conf.all.forwarding=1
    net.ipv6.conf.usb0.accept_ra=2
    net.ipv6.conf.eth0.accept_ra_defrtr=0
  path: /etc/sysctl.d/99-ipforward.conf
# Enabling masquerading and forwarding
- content: |
    add table ip freebox_usb_nat4
    flush table ip freebox_usb_nat4
    add table ip6 freebox_usb_nat6
    flush table ip6 freebox_usb_nat6
    add table inet freebox_usb_filter
    flush table inet freebox_usb_filter

    table ip freebox_usb_nat4 {
            chain POSTROUTING {
                    type nat hook postrouting priority srcnat; policy accept;
                    oifname "usb0" masquerade
            }
    }
    table ip6 freebox_usb_nat6 {
            chain POSTROUTING {
                    type nat hook postrouting priority srcnat; policy accept;
                    oifname "usb0" masquerade
            }
    }
    table inet freebox_usb_filter {
            chain forward {
                    type filter hook forward priority filter; policy drop;
                    iifname "eth0" oifname "usb0" ct state established,related,new accept
                    iifname "usb0" oifname "eth0" ct state established,related accept
                    iifname "eth0" oifname "eth0" accept
            }
    }
  path: /etc/sysconfig/nftables.conf

runcmd:
  - [bash, -lc, 'dnf install -y kernel-modules-$(uname -r)' ]
  - [bash, -lc, 'modprobe cdc_ether' ]
  - [bash, -lc, 'sysctl --system' ]
  - [bash, -lc, 'nmcli con mod "cloud-init eth0" ipv4.never-default yes' ]
  - [bash, -lc, 'nmcli con mod "cloud-init eth0" ipv6.never-default yes' ]
  - [bash, -lc, 'nmcli con mod "cloud-init eth0" +ipv6.addresses fd00:1234::1/64' ]
  - [bash, -lc, 'nmcli con down "cloud-init eth0"' ]
  - [bash, -lc, 'nmcli con up "cloud-init eth0"' ]
  - [bash, -lc, 'systemctl enable --now nftables' ]
