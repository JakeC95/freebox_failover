[freebox]
token_file = /etc/freebox_app_token.json
lan_iface = enp0s5
ip = 192.168.1.254

[ethernet]
enabled = false
primary_mac = 38:07:16:ca:d0:18
lan_network = 192.168.1.0/24
backup_gateway =
lan_ipv6_disabled = false
ipv6_policy = require_disabled
accept_ipv6_limitations = false
dns = 1.1.1.1
probe_hosts = 1.1.1.1 9.9.9.9
standby_check = 15
probe_timeout = 1
health_rise = 2
health_fall = 3

[failover]
check = 2
down = 10
up = 20
garp = 3
unknown_grace = 15
unknown_policy = release
